spring:
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  application:
    name: my_bachelor_motors
  datasource:
    #url: jdbc:mariadb://localhost:3307/my_bachelor_motors
    url: ${DB_URL}
    #url : jdbc:mariadb://mysql-damtab.alwaysdata.net/damtab_mmotors
    username: ${DB_USERNAME}
    #username: damtab_mmotors
    password: ${DB_PASSWORD}
    #password: DamienM_Motors1BDD

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      max-lifetime: 800000
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  port: ${PORT:8080}
app:
  secret-key: ${DB_SECRET_KEY}
  #secret-key: 07f612faa8eaadc715811e244a9d84fdd17eb4e2b1801983d173ee41e06caab4
  expiration-time: ${DB_EXPIRATION_TIME}
  #expiration-time: 900000
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
  level:
    root: INFO
    com:
      damtab:
        my_bachelor_motors: INFO
    org:
      hibernate: error
      springframework:
        security: INFO
        #web: debug
  file:
    name: ./logs/my-app-logs.log

alerting:
  enabled: true
  from: ${spring.mail.username}
  recipients: ${ALERT_EMAILS}
  application-name: My_Motors_Bachelor
  cooldown-minutes: 10

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never